# Publication sur GitHub Pages (à activer au moment de la mise en ligne, après /mokom:audit).
# Réglages du dépôt : Settings › Pages › Source : « GitHub Actions ». Variable SITE_URL : https://<compte>.github.io
name: Publier le site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check && npm run build
        env: { SITE_URL: "${{ vars.SITE_URL }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
